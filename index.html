<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DNS Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>مدیریت DNS پیشرفته</h1>
    
    <div class="card mt-4">
      <div class="card-body">
        <h5>تنظیمات فعلی</h5>
        <div class="mb-3">
          <label>اینترفیس شبکه:</label>
          <select id="interfaceSelect" class="form-select"></select>
        </div>

        <div class="row">
          <div class="col-md-6">
            <label>DNS معمولی</label>
            <input type="text" id="dns1" class="form-control" value="185.51.200.2">
            <input type="text" id="dns2" class="form-control mt-2" value="178.22.122.100">
          </div>

          <div class="col-md-6">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="dotCheck">
              <label class="form-check-label">DNS-over-TLS</label>
              <input type="text" id="dotServer" class="form-control" value="free.shecan.ir">
            </div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="dohCheck">
              <label class="form-check-label">DNS-over-HTTPS</label>
              <input type="text" id="dohServer" class="form-control" 
                     value="https://free.shecan.ir/dns-query">
            </div>
          </div>
        </div>

        <div class="mt-4">
          <button class="btn btn-primary" onclick="applySettings()">اعمال تنظیمات</button>
          <button class="btn btn-warning" onclick="resetDNS()">ریست DNS</button>
        </div>
        <div class="profile-section">
          <h3>مدیریت پروفایل‌ها</h3>
          
          <div class="mb-3">
            <label for="profileName">نام پروفایل:</label>
            <input type="text" id="profileName" class="form-control" placeholder="نام پروفایل">
          </div>
          
          <div class="mb-3">
            <button class="btn btn-success" onclick="saveProfile()">ذخیره پروفایل</button>
            <button class="btn btn-danger" onclick="deleteProfile()">حذف پروفایل</button>
          </div>
          
          <div class="mb-3">
            <label>پروفایل‌های ذخیره شده:</label>
            <select id="profileSelect" class="form-select" onchange="loadSelectedProfile()">
              <option value="">-- انتخاب کنید --</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
